# Mod metadata, read by build.rhai. The per-release half is versions/<release>/release.properties.

mod_id = intricarpet
mod_name = IntriCarpet
mod_version = 2.0.7

# https://fabricmc.net/versions.html
loader_version = 0.18.4

# The Fabric loader jar `scripts/fetch-libs.sh` puts on the compile classpath. The loader is an API
# the mod compiles against (ModInitializer, FabricLoader, PreLaunchEntrypoint); the game supplies it
# at run time.
loader_jar_url = https://maven.fabricmc.net/net/fabricmc/fabric-loader/0.18.4/fabric-loader-0.18.4.jar
