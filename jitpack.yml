before_install:
- sdk install java 17.0.1-open
- sdk use java 17.0.1-open
# `jals expand` lowers the jals dialect sources to plain Java before Gradle compiles them — the step
# the `//#if MC >= …` preprocessor plugin used to do. jals publishes no binaries yet, so it is built
# from source; see docs/jals.md.
- curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
- $HOME/.cargo/bin/cargo install --locked --root /tmp/jals --git https://github.com/topi-banana/jals --rev a46628d6643a6abdcf9e6b82b466fca85b61ffc3 jals-cli

env:
  JALS: /tmp/jals/bin/jals
