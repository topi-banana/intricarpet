// The release this subproject builds, and the packed `1_21_08`-style number the rest of this file
// compares against. The preprocessor plugin used to hand both down from the version graph in
// `build.gradle`; with that gone, the subproject's directory name — which is also its jals
// `[features]` release — is the single source of truth.
final String mcRelease = project.name
final int mcVersion = { ->
  def parts = mcRelease.tokenize('.').collect { it as int }
  parts[0] * 10000 + (parts.size() > 1 ? parts[1] : 0) * 100 + (parts.size() > 2 ? parts[2] : 0)
}()
final boolean unobfuscated = mcVersion >= 26_00_00

apply plugin: 'maven-publish'
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

repositories {
  maven {
    url = 'https://maven.parchmentmc.org'
    content { includeGroup('org.parchmentmc.data') }
  }
  maven {
    url = 'https://masa.dy.fi/maven'
    content { includeModule('carpet', 'fabric-carpet') }
  }
  maven {
    url = 'https://jitpack.io'
    content { includeGroupAndSubgroups('com.github') }
  }
  maven {
    url = 'https://maven.fallenbreath.me/releases'
    content { includeGroup('me.fallenbreath') }
  }
  maven {
    url = 'https://maven.fallenbreath.me/jitpack'
    content { includeGroupAndSubgroups('com.github') }
  }
}

dependencies {
  def processDependency = { dep ->
    // https://github.com/FabricMC/fabric-loader/issues/783
    if (dep instanceof ModuleDependency) {
      if (!(dep.group == 'net.fabricmc' && dep.name == 'fabric-loader')) {
        dep.exclude group: 'net.fabricmc', module: 'fabric-loader'
      }
    }
    return dep
  }
  def autoImplementation = { Object... args -> processDependency(unobfuscated ? implementation(*args) : modImplementation(*args)) }
  def autoRuntimeOnly = { Object... args -> processDependency(unobfuscated ? runtimeOnly(*args) : modRuntimeOnly(*args)) }
  def autoCompileOnly = { Object... args -> processDependency(unobfuscated ? compileOnly(*args) : modCompileOnly(*args)) }

  // loom
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  if (!unobfuscated) {
    mappings loom.layered() {
      officialMojangMappings()
      if (project.parchment_version.size() > 0) {
        parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
      }
    }
  }
  autoImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

  // mods
  if (project.carpet_version.matches('^com.github.[a-zA-Z0-9_-]+:fabric-carpet:[a-z0-9._+-]+$')) {
    autoImplementation project.carpet_version  // jitpack
  } else {
    autoImplementation "carpet:fabric-carpet:${project.carpet_version}"  // masa's maven
  }

  // dependencies
  if (mcVersion < 12005) {
    include("io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}")
  }
}

// --- jals -------------------------------------------------------------------------------------
//
// `src/main/java` is written in the jals dialect: one source set for every Minecraft version, with
// `#[cfg(feature = "mc-ge-…")]` where the old preprocessor had `//#if MC >= …`. `jals expand`
// lowers it to the plain Java this subproject compiles, selecting the release through the
// `[features]` entry named after this subproject. The lowering is length-preserving, so a line
// number in a stack trace is still the authored line.
//
// The executable is `jals` on PATH unless `-Pjals.executable=…` or `$JALS` names another one; see
// `docs/jals.md` for how CI installs it.

String jalsExecutable = (project.findProperty('jals.executable') ?: System.getenv('JALS') ?: 'jals').toString()
File jalsExpanded = layout.buildDirectory.dir('jals/expanded').get().asFile

tasks.register('jalsExpand', Exec) {
  group = 'build'
  description = "Lowers the jals dialect sources for Minecraft ${mcRelease}."
  inputs.dir rootProject.file('src/main/java')
  inputs.file rootProject.file('jals.toml')
  inputs.property 'release', mcRelease
  inputs.property 'executable', jalsExecutable
  outputs.dir jalsExpanded
  workingDir rootProject.projectDir
  executable jalsExecutable
  args 'expand',
       '--manifest-path', rootProject.file('jals.toml').absolutePath,
       '--no-default-features',
       '--features', mcRelease,
       '--out-dir', jalsExpanded.absolutePath
}

// The preprocessor plugin used to redirect these at its own generated tree. A subproject's
// directory holds only `gradle.properties` and the access widener, so both roots are the root
// project's — the sources by way of the lowering above.
sourceSets.main.java.srcDirs = [new File(jalsExpanded, 'src/main/java')]
sourceSets.main.resources.srcDirs = [rootProject.file('src/main/resources')]
tasks.named('compileJava') { dependsOn 'jalsExpand' }

// The two jars `jals build` cannot fetch itself: neither carpet nor the Fabric loader is published
// where jals could pin a digest, so `build.rhai` reads them from `libs/` instead. Gradle has
// already resolved both — carpet remapped to Mojang names by loom — so this copies them over
// rather than downloading anything a second time.
tasks.register('jalsLibs', Copy) {
  group = 'build'
  description = 'Copies carpet and the Fabric loader onto the classpath `jals build` reads.'
  from {
    sourceSets.main.compileClasspath.filter { file ->
      file.name.contains('carpet') || file.name.contains('fabric-loader')
    }
  }
  into rootProject.file('libs')
}

// --- mod packaging ------------------------------------------------------------------------------

String MIXIN_CONFIG_PATH = 'intricarpet.mixins.json'
JavaVersion JAVA_COMPATIBILITY
if (mcVersion >= 260000) {
  JAVA_COMPATIBILITY = JavaVersion.VERSION_25
} else if (mcVersion >= 12005) {
  JAVA_COMPATIBILITY = JavaVersion.VERSION_21
} else if (mcVersion >= 11800) {
  JAVA_COMPATIBILITY = JavaVersion.VERSION_17
} else if (mcVersion >= 11700) {
  JAVA_COMPATIBILITY = JavaVersion.VERSION_16
} else {
  JAVA_COMPATIBILITY = JavaVersion.VERSION_1_8
}
JavaVersion MIXIN_COMPATIBILITY_LEVEL = JAVA_COMPATIBILITY

loom {
  accessWidenerPath = file("intricarpet.accesswidener")

  def commonVmArgs = ['-Dmixin.debug.export=true', '-Dmixin.debug.countInjections=true']
  runConfigs.configureEach {
    // to make sure it generates all "Minecraft Client (:subproject_name)" applications
    ideConfigGenerated = true
    runDir '../../run'
    vmArgs commonVmArgs
  }

  mixin {
    useLegacyMixinAp = !unobfuscated
  }
}

String modVersionSuffix = ''
String artifactVersion = project.mod_version
String artifactVersionSuffix = ''
// detect github action environment variables
// https://docs.github.com/en/actions/learn-github-actions/environment-variables#default-environment-variables
if (System.getenv("BUILD_RELEASE") != "true") {
  String buildNumber = System.getenv("BUILD_ID")
  modVersionSuffix += buildNumber != null ? ('+build.' + buildNumber) : '-SNAPSHOT'
  artifactVersionSuffix = '-SNAPSHOT'  // A non-release artifact is always a SNAPSHOT artifact
}
String fullModVersion = project.mod_version + modVersionSuffix
String fullProjectVersion, fullArtifactVersion

// Example version values:
//   project.mod_version     1.0.3                      (the base mod version)
//   modVersionSuffix        +build.88                  (use github action build number if possible)
//   artifactVersionSuffix   -SNAPSHOT
//   fullModVersion          1.0.3+build.88             (the actual mod version to use in the mod)
//   fullProjectVersion      v1.0.3-mc1.15.2+build.88   (in build output jar name)
//   fullArtifactVersion     1.0.3-mc1.15.2-SNAPSHOT    (maven artifact version)

group = project.maven_group
if (System.getenv("JITPACK") == "true") {
  // move mc version into archivesBaseName, so jitpack will be able to organize archives from multiple subprojects correctly
  base.archivesName = project.archives_base_name + '-mc' + project.minecraft_version
  fullProjectVersion = 'v' + project.mod_version + modVersionSuffix
  fullArtifactVersion = artifactVersion + artifactVersionSuffix
} else {
  base.archivesName = project.archives_base_name
  fullProjectVersion = 'v' + project.mod_version + '-mc' + project.minecraft_version + modVersionSuffix
  fullArtifactVersion = artifactVersion + '-mc' + project.minecraft_version + artifactVersionSuffix
}
version = fullProjectVersion

// See https://youtrack.jetbrains.com/issue/IDEA-296490
// if IDEA complains about "Cannot resolve resource filtering of MatchingCopyAction" and you want to know why
processResources {
  from "intricarpet.accesswidener"

  def modProperties = [
      "id"                  : project.mod_id,
      "name"                : project.mod_name,
      "version"             : fullModVersion,
      "carpet_dependency"   : project.carpet_dependency,
      "minecraft_dependency": project.minecraft_dependency,
  ]
  inputs.properties(modProperties)

  filesMatching("fabric.mod.json") {
    expand modProperties
  }

  filesMatching(MIXIN_CONFIG_PATH) {
    filter { s -> s.replace('{{COMPATIBILITY_LEVEL}}', "JAVA_${MIXIN_COMPATIBILITY_LEVEL.ordinal() + 1}") }
  }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
  options.encoding = "UTF-8"
  options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
  if (JAVA_COMPATIBILITY <= JavaVersion.VERSION_1_8) {
    // suppressed "source/target value 8 is obsolete and will be removed in a future release"
    options.compilerArgs << '-Xlint:-options'
  }
}

java {
  sourceCompatibility = JAVA_COMPATIBILITY
  targetCompatibility = JAVA_COMPATIBILITY

  // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
  // if it is present.
  // If you remove this line, sources will not be generated.
  withSourcesJar()
}

jar {
  inputs.property "archives_base_name", project.archives_base_name
  from(rootProject.file('LICENSE')) {
    rename { "${it}_${inputs.properties.archives_base_name}" }
  }
}

// configure the maven publication
publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
      artifactId = base.archivesName.get()
      version = fullArtifactVersion
    }
  }

  // select the repositories you want to publish to
  repositories {
    // mavenLocal()
  }
}
