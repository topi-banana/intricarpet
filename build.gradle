plugins {
  id 'maven-publish'
  id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
  id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
}

// There is no source preprocessor here any more. `src/main/java` is one jals-dialect source set for
// every Minecraft version, and `jals expand` lowers it to plain Java per subproject — the version
// graph the preprocessor plugin needed (its nodes, their links, and the mapping file on one of
// them) is now `[features]` in `jals.toml`. See `docs/jals.md`; the wiring is in `common.gradle`.

tasks.register('buildAndGather') {
  subprojects {
    dependsOn project.tasks.named('build').get()
  }
  doFirst {
    println 'Gathering builds'
    def buildLibs = {
      p -> p.buildDir.toPath().resolve('libs')
    }
    delete fileTree(buildLibs(rootProject)) {
      include '*'
    }
    subprojects {
      copy {
        from(buildLibs(project)) {
          include '*.jar'
          exclude '*-dev.jar', '*-sources.jar', '*-shadow.jar'
        }
        into buildLibs(rootProject)
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
      }
    }
  }
}
