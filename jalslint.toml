# The gate CI runs once per Minecraft release. What it is there to catch is the *conversion*: that
# every `#[cfg]` in the tree is well-formed and sits on a construct that can host one, under each of
# the fifteen selections. Those are structural attribute errors, which `jals-lint` reports under the
# fixed `cfg` rule and deliberately does not put behind a severity — a build-blocking error is not a
# configurable lint — so nothing below can switch the gate off.
#
# Everything turned down here is turned down so that gate is what fails, rather than a style opinion
# or an analysis limitation that no release selection can change.

[rules]
# A Mixin injector's signature is fixed by the framework: an `@Inject` handler takes its
# `CallbackInfo` whether or not it cancels, and a `@WrapWithCondition` handler takes every argument
# of the call it wraps. `unused-local` would flag parameters the method cannot drop — the
# `@Override`-shaped false positive the rule's own documentation says to suppress here.
unused-local = "allow"

# This codebase's own style, and older than the migration: `MOD_ID`-shaped mutable statics, and
# single-statement bodies written without braces. Neither is something a release can change.
naming-convention = "allow"
missing-braces = "allow"

# `jals lint` is always offline: it reads whatever the verified cache already holds, and the CI job
# that runs it per release deliberately does not fetch a game jar fifteen times over. With no
# classpath there is no authority on what a name resolves to, so the rule would report the JDK stub
# set's gaps (`NoSuchFieldException`) rather than anything about this source. `javac` is the
# authority on resolution for the releases that reach it.
cannot-resolve = "allow"

# There is no key for the `cfg` rule's other half — one `Advice` per `cfg`-disabled construct, which
# is the point of the file in an editor. It is a hint, and a hint does not fail a lint run.
