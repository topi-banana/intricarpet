name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to attach the jars to
        type: string
        required: true

permissions:
  contents: write

env:
  # >>> REVERT BEFORE MERGE: pin back to `main` <<<
  # The branch of topi-banana/jals#238 — see the note beside `uses:` below, and `ci.yml`'s longer
  # one for why `main` will not do even once the action lands there.
  JALS_VERSION: claude/gradle-removal-jals-migration-49n13e

jobs:
  build:
    # The same fifteen cells as `ci.yml`, built as releases: `JALS_BUILD_RELEASE` drops the
    # `-SNAPSHOT`/`+build.N` suffix `build.rhai` otherwise puts in `fabric.mod.json`.
    #
    # Only the two unobfuscated releases produce a jar today (README §What is not there yet), so
    # every other cell is best-effort and uploads nothing. When jals grows intermediary mappings
    # this list needs no edit: the cells that start producing jars start uploading them.
    name: ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.17.1"
          - minecraft: "1.18.2"
          - minecraft: "1.19.2"
          - minecraft: "1.19.3"
          - minecraft: "1.19.4"
          - minecraft: "1.20.1"
          - minecraft: "1.20.2"
          - minecraft: "1.21.1"
          - minecraft: "1.21.4"
          - minecraft: "1.21.5"
          - minecraft: "1.21.8"
          - minecraft: "1.21.10"
          - minecraft: "1.21.11"
          - minecraft: "26.1.2"
            compile: true
          - minecraft: "26.2"
            compile: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore the installed jals
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/jals
          key: jals-${{ env.JALS_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install jals
      # >>> REVERT BEFORE MERGE: pin back to `topi-banana/jals@main` <<<
      # The `Setup jals` action lives on topi-banana/jals#238 and is not on `main` yet, so
      # `@main` resolves to a commit with no `action.yml` and every cell dies before doing any
      # work. Pointing at that PR's branch is what makes this PR's CI say anything at all; it is
      # not how this should merge. `uses:` takes no expression, so the ref cannot come from the
      # `env` block above and each of the three call sites carries this note.
        uses: topi-banana/jals@claude/gradle-removal-jals-migration-49n13e
        with:
          version: ${{ env.JALS_VERSION }}
      - name: Build
        continue-on-error: ${{ !matrix.compile }}
        env:
          JALS_BUILD_RELEASE: "true"
        run: jals build --features "${{ matrix.minecraft }}"
      # The jar `[build] remap` writes is named from `[package]`, so every cell produces the same
      # file name; the Minecraft version goes on here, where the selection is known.
      - name: Name the jar after the release it targets
        if: matrix.compile
        run: |
          set -euo pipefail
          mkdir -p dist
          for jar in target/jals/remap/*.jar; do
            base=$(basename "$jar" .jar)
            cp "$jar" "dist/${base}-mc${{ matrix.minecraft }}.jar"
          done
          ls -l dist
      - name: Upload the jar
        if: matrix.compile
        uses: actions/upload-artifact@v7
        with:
          name: intricarpet-mc${{ matrix.minecraft }}
          path: dist/*.jar
          if-no-files-found: error

  publish:
    name: attach the jars to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download every built jar
        uses: actions/download-artifact@v8
        with:
          pattern: intricarpet-mc*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - name: Attach them to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          files: dist/*.jar
