name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to attach the jars to
        type: string
        required: true

permissions:
  contents: write

env:
  JALS_VERSION: main

jobs:
  jals:
    # The same resolution as `ci.yml`, and for the same reason: `JALS_VERSION` may name a moving
    # ref, and a tool cache keyed on the ref's *name* never invalidates — every run after the
    # first is served the jals that happened to be current when the entry was written. Key on the
    # commit the ref points at instead, resolved once for the whole run.
    name: resolve jals
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.resolve.outputs.id }}
    steps:
      - name: Resolve JALS_VERSION to something immutable
        id: resolve
        run: |
          set -euo pipefail
          if [ "${JALS_VERSION}" = latest ]; then
            # `latest` is a published release, so the tag name is the immutable half; re-cutting a
            # release moves the tag and therefore the key.
            id=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/topi-banana/jals/releases/latest | jq -r .tag_name)
          else
            # A branch or a tag resolves to its commit. `git ls-remote` prints nothing for a raw
            # commit sha, which is already immutable and needs no resolving.
            # `head -n1` because a pattern matches every ref ending in it, and a branch
            # and a tag of the same name would otherwise put two shas in the key.
            id=$(git ls-remote https://github.com/topi-banana/jals "${JALS_VERSION}" \
              | head -n1 | cut -f1) || true
            [ -n "${id}" ] || id="${JALS_VERSION}"
          fi
          [ -n "${id}" ] && [ "${id}" != null ] || {
            echo "could not resolve JALS_VERSION=${JALS_VERSION} against topi-banana/jals" >&2
            exit 1
          }
          echo "${JALS_VERSION} -> ${id}"
          echo "id=${id}" >>"$GITHUB_OUTPUT"

  build:
    # The same fifteen cells as `ci.yml`, built as releases: `JALS_BUILD_RELEASE` drops the
    # `-SNAPSHOT`/`+build.N` suffix `build.rhai` otherwise puts in `fabric.mod.json`.
    #
    # Only the two unobfuscated releases produce a jar today (README §What is not there yet), so
    # every other cell is best-effort and uploads nothing. When jals grows intermediary mappings
    # this list needs no edit: the cells that start producing jars start uploading them.
    needs: jals
    name: ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.17.1"
          - minecraft: "1.18.2"
          - minecraft: "1.19.2"
          - minecraft: "1.19.3"
          - minecraft: "1.19.4"
          - minecraft: "1.20.1"
          - minecraft: "1.20.2"
          - minecraft: "1.21.1"
          - minecraft: "1.21.4"
          - minecraft: "1.21.5"
          - minecraft: "1.21.8"
          - minecraft: "1.21.10"
          - minecraft: "1.21.11"
          - minecraft: "26.1.2"
            compile: true
          - minecraft: "26.2"
            compile: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore the installed jals
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/jals
          key: jals-${{ needs.jals.outputs.id }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install jals
        uses: topi-banana/jals@main
        with:
          version: ${{ env.JALS_VERSION }}
      - name: Build
        continue-on-error: ${{ !matrix.compile }}
        env:
          JALS_BUILD_RELEASE: "true"
        run: jals build --features "${{ matrix.minecraft }}"
      # The jar `[build] remap` writes is named from `[package]`, so every cell produces the same
      # file name; the Minecraft version goes on here, where the selection is known.
      - name: Name the jar after the release it targets
        if: matrix.compile
        run: |
          set -euo pipefail
          mkdir -p dist
          for jar in target/jals/remap/*.jar; do
            base=$(basename "$jar" .jar)
            cp "$jar" "dist/${base}-mc${{ matrix.minecraft }}.jar"
          done
          ls -l dist
      - name: Upload the jar
        if: matrix.compile
        uses: actions/upload-artifact@v7
        with:
          name: intricarpet-mc${{ matrix.minecraft }}
          path: dist/*.jar
          if-no-files-found: error

  publish:
    name: attach the jars to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download every built jar
        uses: actions/download-artifact@v8
        with:
          pattern: intricarpet-mc*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - name: Attach them to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          files: dist/*.jar
