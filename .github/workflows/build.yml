name: step.build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false
      target_subproject:
        description: The Minecraft release to be built. Leave it empty to build all
        type: string
        required: false
        default: ''

env:
  # The jals revision this build uses. Keep it in step with the `minecraft` dependency pinned in
  # `jals.toml`.
  JALS_REV: a661e89f79b87d75ec09deed3331520ef90d9393

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      # jals is the whole build: it lowers the dialect sources, compiles them, and packages the mod
      # jar. It publishes no binaries yet, so it is built from source once per pinned revision and
      # cached.
      - name: Cache jals
        id: cache_jals
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/jals
          key: ${{ runner.os }}-jals-${{ env.JALS_REV }}

      - name: Install jals
        if: steps.cache_jals.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/topi-banana/jals --rev "$JALS_REV" jals-cli

      # The verified artifact cache holds the remapped, decompiled Minecraft the `minecraft`
      # dependency produces. It is the expensive part of a cold build by a wide margin.
      - name: Cache jals artifacts
        uses: actions/cache@v6
        with:
          path: target/jals/cache
          key: ${{ runner.os }}-jals-artifacts-${{ hashFiles('jals.toml', 'build.rhai') }}
          restore-keys: |
            ${{ runner.os }}-jals-artifacts-

      - name: Select releases
        id: releases
        run: |
          if [ -n "${{ inputs.target_subproject }}" ]; then
              echo "list=${{ inputs.target_subproject }}" >> $GITHUB_OUTPUT
          else
              echo "list=$(ls versions | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi

      # Lowering is release-specific, so a `#[cfg]` mistake can be invisible in the release a run
      # packages. Checking every one costs seconds and needs nothing but jals.
      - name: Check every release lowers
        run: |
          for release in $(ls versions); do
            echo "::group::$release"
            jals expand --no-default-features --features "$release" --dry-run
            echo "::endgroup::"
          done

      # Carpet's published jar is in Mojang names only from 26.1; before that it is in Fabric's
      # intermediary namespace, and nothing here can remap it (see docs/jals.md). Those releases
      # therefore lower and lint but are not compiled.
      - name: Package
        env:
          JALS_BUILD_ID: ${{ github.run_number }}
          JALS_BUILD_RELEASE: ${{ inputs.release }}
        run: |
          mkdir -p dist
          mod_version=$(sed -n 's/^[[:space:]]*mod_version[[:space:]]*=[[:space:]]*//p' mod.properties)
          for release in ${{ steps.releases.outputs.list }}; do
            properties="versions/$release/release.properties"
            namespace=$(sed -n 's/^[[:space:]]*carpet_namespace[[:space:]]*=[[:space:]]*//p' "$properties")
            if [ "$namespace" != "official" ]; then
              echo "::notice title=$release::skipped: carpet is published in the $namespace namespace"
              continue
            fi
            minecraft=$(sed -n 's/^[[:space:]]*minecraft_version[[:space:]]*=[[:space:]]*//p' "$properties")
            echo "::group::$release"
            scripts/fetch-libs.sh "$release"
            jals package --no-default-features --features "$release" \
                         --out "dist/intricarpet-v$mod_version-mc$minecraft.jar"
            echo "::endgroup::"
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: dist/

  summary:
    runs-on: ubuntu-22.04
    needs:
      - build

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build-artifacts

      - name: Make build summary
        run: python3 .github/workflows/scripts/summary.py  # Python 3.10.6
        env:
          TARGET_SUBPROJECT: ${{ inputs.target_subproject }}
