name: step.build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false
      target_subproject:
        description: The subproject name of the specified Minecraft version to be built. Leave it empty to build all
        type: string
        required: false
        default: ''

env:
  # The jals revision `jals expand` is taken from. Keep it in step with the `minecraft` dependency
  # pinned in `jals.toml`.
  JALS_REV: a46628d6643a6abdcf9e6b82b466fca85b61ffc3

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Cache gradle files
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/*.accesswidener') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # `jals expand` lowers the jals dialect sources to the plain Java each subproject compiles —
      # what the `//#if MC >= …` preprocessor plugin used to do. jals publishes no binaries yet, so
      # it is built from source once per pinned revision and cached.
      - name: Cache jals
        id: cache_jals
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/jals
          key: ${{ runner.os }}-jals-${{ env.JALS_REV }}

      - name: Install jals
        if: steps.cache_jals.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/topi-banana/jals --rev "$JALS_REV" jals-cli

      # Lowering is release-specific, so a `#[cfg]` mistake can be invisible in the release this run
      # packages. Checking every one costs seconds and needs no Gradle, JDK or network.
      - name: Check every release lowers
        run: |
          for dir in versions/*/; do
            release="$(basename "$dir")"
            echo "::group::$release"
            jals expand --no-default-features --features "$release" --dry-run
            echo "::endgroup::"
          done

      - name: Get subproject name to build
        id: subproject_info
        run: |
          if [ "${{ inputs.target_subproject }}" != "" ]
          then
              echo "prefix=${{ inputs.target_subproject }}:" >> $GITHUB_OUTPUT
          else
              echo "prefix=" >> $GITHUB_OUTPUT
          fi

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.subproject_info.outputs.prefix }}build --no-daemon
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: ${{ inputs.release }}

      - uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: versions/*/build/libs/

  summary:
    runs-on: ubuntu-22.04
    needs:
      - build

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build-artifacts

      - name: Make build summary
        run: python3 .github/workflows/scripts/summary.py  # Python 3.10.6
        env:
          TARGET_SUBPROJECT: ${{ inputs.target_subproject }}
